<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>온보드 (OnBoard) | 생각을 나누는 따뜻한 실시간 커뮤니티</title>
    
    <!-- 기본 메타태그 (SEO) -->
    <meta name="description" content="온보드(OnBoard)는 자유로운 이야기와 깊이 있는 토론이 피어나는 실시간 커뮤니티입니다. 회원가입 후 다양한 주제로 소통하고 멤버십 혜택을 경험하세요." />
    <meta name="keywords" content="커뮤니티, 온보드, 게시판, IT, 일상, 토론, 질문답변, 회원제커뮤니티, 토스페이먼츠, 카카오로그인" />
    <meta name="author" content="OnBoard Team" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://0915-project.vercel.app/" />

    <!-- Open Graph 메타태그 (카카오톡, 페이스북, 슬랙 링크 공유 썸네일 최적화) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="온보드 커뮤니티" />
    <meta property="og:title" content="온보드 (OnBoard) | 이야기가 시작되는 곳" />
    <meta property="og:description" content="따뜻한 사람들과 나누는 즐거운 이야기! 온보드 커뮤니티에 지금 참여해보세요." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=1200&h=630&q=80" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://0915-project.vercel.app/" />
    <meta property="og:locale" content="ko_KR" />

    <!-- Twitter Card 메타태그 (트위터/X 공유 최적화) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="온보드 (OnBoard) | 커뮤니티 보드" />
    <meta name="twitter:description" content="생각을 나누는 따뜻한 실시간 소통 공간, 온보드" />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=1200&h=630&q=80" />

    <!-- 모바일 테마 컬러 -->
    <meta name="theme-color" content="#2563eb" />
    <meta name="msapplication-navbutton-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-status-bar-style" content="#2563eb" />

    <!-- 구조화 데이터 (JSON-LD) - 검색엔진 스니펫 노출 -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "온보드 커뮤니티",
      "url": "https://0915-project.vercel.app/",
      "description": "생각을 나누는 따뜻한 커뮤니티, 온보드",
      "inLanguage": "ko-KR",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://0915-project.vercel.app/posts?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <script>
      window.addEventListener('error', function(e) {
        console.error('온보드 클라이언트 오류:', e.error || e.message);
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('온보드 비동기 처리 오류:', e.reason);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
